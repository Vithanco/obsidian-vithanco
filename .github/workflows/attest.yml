# Attests a release's main.js and styles.css, which Obsidian's directory review
# looks for. It builds the release's tag here, checks that build is byte-identical
# to the released files, and attests it. Releases are still built and published
# on the maintainer's machine (VGraph ADR 0036): this job can write attestations,
# but not publish, push or create a release.
# Actions are pinned to a full commit SHA, as in VGraph.
name: Attest release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attest, e.g. 1.0.12
        required: true

permissions:
  contents: read

jobs:
  attest:
    name: Attest the release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      # The check comes from this workflow's own commit: a tag older than the
      # workflow does not contain it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .attest
          sparse-checkout: scripts/release-matches-build.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: The release is this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern main.js --pattern styles.css --dir "$RUNNER_TEMP/released"
          node .attest/scripts/release-matches-build.mjs "$RUNNER_TEMP/released" main.js styles.css
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            styles.css
