# Builds this plugin against the current VGraph engine. The repo also builds on its
# own from the committed engine (Obsidian's directory does that); checked out inside
# VGraph, the build refreshes that copy from website/Package first, as it does on the
# maintainer's machine. It only checks: releases stay on that machine (VGraph ADR 0036).
# Actions are pinned to a full commit SHA, as in VGraph.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Obsidian's directory clones only this repo and runs `npm run build`; 1.0.10
  # failed there because the engine came from ../../website/Package.
  standalone:
    name: Build from this repo alone
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: main.js fits Obsidian Sync's 5 MB limit
        run: |
          size=$(wc -c < main.js)
          echo "main.js is $size bytes"
          [ "$size" -le 5000000 ]

  build:
    name: Build against the VGraph engine
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Vithanco/VGraph
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: obsidian-vithanco
          persist-credentials: false
      # A build can pass while calling an export the engine no longer has.
      - name: Every engine call still exists
        run: ./scripts/check-plugin-api.sh
      - name: Identify the engine
        id: engine
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore the engine
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/Package
          key: engine-${{ steps.engine.outputs.sha }}
      # The container comes from VGraph's .swift-version, so a Swift bump there needs no change here.
      - name: Build the engine
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$PWD:/work" -w /work "swift:$(tr -d '[:space:]' < .swift-version)-noble" ./scripts/ci-engine.sh
          sudo chown -R "$(id -u):$(id -g)" .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the plugin
        working-directory: obsidian-vithanco
        run: |
          npm ci
          npm test
          npm run lint
          npm run typecheck
          npm run build
      # main.js carries the engine; a debug engine shipped as 115 MB in 1.0.9, and
      # Obsidian Sync's Standard plan skips files over 5 MB.
      - name: The bundle holds an optimized engine
        run: |
          ./scripts/check-wasm-optimized.sh obsidian-vithanco/VGraphWasm.wasm
          size=$(wc -c < obsidian-vithanco/main.js)
          echo "main.js is $size bytes"
          [ "$size" -le 5000000 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: obsidian-vithanco
          if-no-files-found: error
          path: |
            obsidian-vithanco/main.js
            obsidian-vithanco/manifest.json
            obsidian-vithanco/styles.css
            obsidian-vithanco/VGraphWasm.wasm
